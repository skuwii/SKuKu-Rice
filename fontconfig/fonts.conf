<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>

  <!-- fontconfig 2.18 dropped the rules that kept ttf-ms-fonts out of the
       generic aliases, so monospace/sans-serif/serif all fell through to
       Andale Mono / Verdana / Times New Roman. Every generic is pinned to
       JetBrainsMono Nerd Font by choice - one typeface system-wide. -->

  <!-- LibreOffice only: when a document names a font that isn't installed, fall back
       to a proportional font instead of JetBrainsMono. A monospace fallback is far
       wider than what the file was laid out with, so Windows-made documents reflow
       and clip. The LibreOffice UI itself still uses JetBrainsMono (set by name
       through gsettings). Must stay above the generic aliases. -->
  <match target="pattern">
    <test name="prgname"><string>soffice.bin</string></test>
    <test name="family" qual="any"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="same"><string>Arial</string></edit>
  </match>
  <match target="pattern">
    <test name="prgname"><string>soffice.bin</string></test>
    <test name="family" qual="any"><string>serif</string></test>
    <edit name="family" mode="prepend" binding="same"><string>Times New Roman</string></edit>
  </match>

  <!-- Missing document fonts mapped to the closest installed one. These are
       substitutes for fonts we don't have, not remaps of fonts we do. -->
  <match target="pattern">
    <test name="family" qual="any"><string>Aptos</string></test>
    <edit name="family" mode="append" binding="same"><string>Carlito</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>Aptos Display</string></test>
    <edit name="family" mode="append" binding="same"><string>Carlito</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>Aptos Narrow</string></test>
    <edit name="family" mode="append" binding="same"><string>Carlito</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>Calibri Light</string></test>
    <edit name="family" mode="append" binding="same"><string>Carlito</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>Candara</string></test>
    <edit name="family" mode="append" binding="same"><string>Carlito</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>Corbel</string></test>
    <edit name="family" mode="append" binding="same"><string>Carlito</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>Segoe UI</string></test>
    <edit name="family" mode="append" binding="same"><string>Carlito</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>Segoe UI Light</string></test>
    <edit name="family" mode="append" binding="same"><string>Carlito</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>Segoe UI Semibold</string></test>
    <edit name="family" mode="append" binding="same"><string>Carlito</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>Tahoma</string></test>
    <edit name="family" mode="append" binding="same"><string>Verdana</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>Century Gothic</string></test>
    <edit name="family" mode="append" binding="same"><string>Arial</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>Arial Narrow</string></test>
    <edit name="family" mode="append" binding="same"><string>Arial</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>Gill Sans MT</string></test>
    <edit name="family" mode="append" binding="same"><string>Arial</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>Franklin Gothic Medium</string></test>
    <edit name="family" mode="append" binding="same"><string>Arial</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>Constantia</string></test>
    <edit name="family" mode="append" binding="same"><string>Caladea</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>Garamond</string></test>
    <edit name="family" mode="append" binding="same"><string>Caladea</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>Book Antiqua</string></test>
    <edit name="family" mode="append" binding="same"><string>Caladea</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>Palatino Linotype</string></test>
    <edit name="family" mode="append" binding="same"><string>Caladea</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>Century</string></test>
    <edit name="family" mode="append" binding="same"><string>Caladea</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>Bookman Old Style</string></test>
    <edit name="family" mode="append" binding="same"><string>Caladea</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>Traditional Arabic</string></test>
    <edit name="family" mode="append" binding="same"><string>Noto Naskh Arabic</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>Simplified Arabic</string></test>
    <edit name="family" mode="append" binding="same"><string>Noto Naskh Arabic</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>Arabic Typesetting</string></test>
    <edit name="family" mode="append" binding="same"><string>Noto Naskh Arabic</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>Sakkal Majalla</string></test>
    <edit name="family" mode="append" binding="same"><string>Noto Naskh Arabic</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>Dubai</string></test>
    <edit name="family" mode="append" binding="same"><string>Noto Sans Arabic</string></edit>
  </match>

  <alias>
    <family>monospace</family>
    <prefer>
      <family>JetBrainsMono Nerd Font</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>

  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>JetBrainsMono Nerd Font</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>

  <alias>
    <family>serif</family>
    <prefer>
      <family>JetBrainsMono Nerd Font</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>

  <alias>
    <family>system-ui</family>
    <prefer>
      <family>JetBrainsMono Nerd Font</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>

  <alias>
    <family>ui-monospace</family>
    <prefer>
      <family>JetBrainsMono Nerd Font</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>

  <alias>
    <family>ui-sans-serif</family>
    <prefer>
      <family>JetBrainsMono Nerd Font</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>

  <alias>
    <family>ui-serif</family>
    <prefer>
      <family>JetBrainsMono Nerd Font</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>

  <alias>
    <family>cursive</family>
    <prefer>
      <family>JetBrainsMono Nerd Font</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>

  <alias>
    <family>fantasy</family>
    <prefer>
      <family>JetBrainsMono Nerd Font</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>

  <!-- UI-only fonts (Adwaita/Cantarell) are forced to JetBrainsMono.
       Document fonts (Arial, Times, Calibri...) are deliberately NOT remapped:
       PDFs and Office files position text using the original font's metrics,
       so substituting a wider monospace font makes text overlap and clip. -->
  <match target="pattern">
    <test name="family"><string>Adwaita Sans</string></test>
    <edit name="family" mode="assign" binding="same"><string>JetBrainsMono Nerd Font</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Adwaita Mono</string></test>
    <edit name="family" mode="assign" binding="same"><string>JetBrainsMono Nerd Font</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Cantarell</string></test>
    <edit name="family" mode="assign" binding="same"><string>JetBrainsMono Nerd Font</string></edit>
  </match>

</fontconfig>
