<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>

  <!-- fontconfig 2.18 dropped the rules that kept ttf-ms-fonts out of the
       generic aliases, so monospace/sans-serif/serif all fell through to
       Andale Mono / Verdana / Times New Roman. Pin them explicitly. -->

  <alias>
    <family>monospace</family>
    <prefer>
      <family>JetBrainsMono Nerd Font</family>
      <family>Adwaita Mono</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>

  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Adwaita Sans</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>

  <!-- Times New Roman is the only actual serif installed, so serif stays a
       serif rather than being folded into Adwaita Sans. Install a Noto/
       DejaVu serif and put it above this line if you want off the MS font. -->
  <alias>
    <family>serif</family>
    <prefer>
      <family>Times New Roman</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>

  <!-- Keep the MS fonts available by name, just never as a generic default. -->

</fontconfig>
