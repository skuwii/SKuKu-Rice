general {
    lock_cmd = mkdir -p "$HOME/.local/state/resume-probe"; pidof hyprlock || hyprlock >>"$HOME/.local/state/resume-probe/hyprlock.log" 2>&1
    inhibit_sleep = 3
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action="on"})'; $HOME/.dotfiles/scripts/resume-probe.sh
}

listener {
    timeout = 300
    on-timeout = brightnessctl -s set 20%
    on-resume = brightnessctl -r
}

listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

listener {
    timeout = 900
    on-timeout = systemctl suspend
}
